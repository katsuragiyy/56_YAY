 # Game Rules
 SIA_FRAGMENTATION_STATUS:0 "@SIA Siamese Fragmentation"
 RULE_OPTION_SIA_FRAGMENTED:0 "@KSK@WAK Bocchi at War"
 RULE_OPTION_SIA_FRAGMENTED_DESC:0 "Kessoku has always been in a rough spot, having resisted the French, British, and Dutch colonization, it's independence has by many been considered truly a miracle. With the recent political instability and the assasination of the previous monarch, a distant cousin from Japan, Hitori Gotoh rising to the throne is for many the last nail in the coffin for Kessoku. \n\nSelect @FRI§YFrench Indochina§! to play @KSK§YKessoku§!. \nSelect @SIA§YSiam§! to play @WAK§YWakaru§!"

 # Focuses
 KSK_establish_the_ministry_of_defense:0 "Establish the Ministry of Defense"
 KSK_establish_the_ministry_of_defense_desc:0 "As part of our modernization program, we must take steps towards reforming the armed forces. Beginning from establishing a ministry dedicated to the defense of the nation."

 KSK_kessokan_royal_armed_forces:0 "[ROOT.GetAdjective] Armed Forces"
 KSK_kessokan_royal_armed_forces_desc:0 "The [ROOT.GetAdjective] has a long history of armed engagements. Most infamous is the Kessokan-Franco wars in the 19th century, which resulted in our victory and our independence being secured."

 KSK_trust_in_pasan:0 "Trust in Pa-San"
 KSK_trust_in_pasan_desc:0 "Pa-San, our former military attaché in Vienna, is the main advocate for the mechanization of the army, with her believing that only through the 'Blitzkrieg' strategy can Kessoku defeat all of its neighbours and regain its lost glory."

