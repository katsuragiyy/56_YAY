l_english:

 # Characters
 KSK_hitori_gotoh:0 "Gotō Hitori"
 KSK_hitori_gotoh_desc:0 "After the assasination of the Kessokan Royal Family, a distant cousin by the name of Hitori Goto, more commonly known as 'Bocchi' claimed the Kessokan throne. Due to her social issues and anxiety, many within the kingdom refer to her as an uncapable leader."

 KSK_ryo_yamada:0 "Yamada Ryō"
 KSK_ryo_yamada_desc:0 "An introverted Japanese businesswoman, Ryō actively seeks out ways to get wealthier, often at the expense of others around her. She arrived to Kessoku after hearing of the instability brought about by the assasination of the royal family and how this instability could greatly benefit her."

 KSK_kita_ikuyo:0 "Kita Ikuyo"
 KSK_kita_ikuyo_desc:0 "A Filipino extrovert, Kita arrived in Kessoku on the basis of liberating the people from the oppressive Kessokan monarchy. From then on, she has managed to rise through the ranks of the Kessokan government, often times utilizing her Extroverted-Aura to coerce her political opponents."

 KSK_nijika_ijichi:0 "Ijichi Nijika"
 KSK_nijika_ijichi_desc:0 "Born into a Christian household in Shimokitazawa, she is often times nicknamed 'The Angel of Shimokitazawa' for spreading the gospel in Kessoku and her noble acts for the Kessokan people. Having formed her own cult of followers, she has been able to depose the monarchy and now rules Kessoku as the supreme messanger of God."

 KSK_seika_ijichi:0 "Ijichi Seika"
 KSK_seika_ijichi_desc:0 "Older sister of the cult leader Ijichi Nijika, she usually is the voice of reason within Nijika's inner circle, and has on multiple occasions had to restrict or intervene in order to prevent Nijika from committing unspeakable atrocities. She is also the manager of a club house called "Starry" in Shimokitazawa."

 KSK_pa_san:0 "Pa-San"
 KSK_pa_san_desc:0 "WIP"

 KSK_kikuri_hiroi:0 "Kirkuri Hiroi"

 KSK_futari_gotoh:0 "Gotō Futari"

 # Ideas
 BaW_KSK_army_issues:0 "Army Issues"
 BaW_KSK_army_issues_desc:0 "The [ROOT.GetAdjective] army is currently in shambles. After our glorious victory in the 1870s during the Kessoku-Franco wars, the [ROOT.GetAdjective] started to deteriorate in multiple aspects, such as combat readiness, organization, supply, and experience. \n\nAlthough, some of the young officers are starting to show promising results, such as Seika Ijichi, who studied abroad in Japan, and Pa-San, who was the Kessokan military attache in Vienna. The future of the army depends on these young officers and their modernization efforts to succeed."

 BaW_KSK_economic_issues:0 "Economic Issues"
 BaW_KSK_economic_issues_desc:0 "The Great Depression has had a massive impact on our small and fragile economy. Many are in poverty because of the economic collapse world wide, and if we aren't quick to act on this, we may experience a total economic collapse."

 KSK_native_opposition:0 "Native Opposition"
 KSK_native_opposition_desc:0 "In the 17th century after the establishment of the Tokugawa Shogunate in mainland Japan, many Japanese fled to what would now be known as Kessoku. Over the course of the last few generations, native opposition towards Kessokan domination over their lands has led to mass dissent and unrest in all parts of the country. Movements such as the Viet Minh have taken a confrontation approach and often clash with civil police."

