 # characters
 KAZ_elizaveta_alikhanovna: "Elizaveta Saduakasova"
 KAZ_elizaveta_alikhanovna_leader_desc: "As the daughter of Alikhan Bukeikhanov, the first and only prime minister of the Alash Autonomy, which existed within the borders of Kazakhstan from 1917 to 1920, Zeynep, better known as Elizaveta, grew up in the shadow of her father's political legacy. Her father's association with the Alash Orda made her a person of interest to both Tsarist and Soviet authorities throughout her life, leading to repeated oppression and relocation across Russia. \n\nBorn Elizaveta (Zeynep) Alikhanovna Sevost'yanova in 1903 to parents of Kazakh and Russian descent in the city of Omsk. Elizaveta spent much of her youth moving throughout Tsarist Russia due to her father's reputation among the Russian aristocracy and secret police. During the final years of the Russian civil war and Alash Orda, Elizaveta found herself working for the Kirgiz Revolutionary Committee as a result of increased Alash-Soviet cooperation. This was short-lived, however, and her involvement within the committee ended following the dissolution of the Alash Orda. \n\nFollowing the recent restoration of the Kazakh state, many within the government chose her as a successor to her father. Her youth, lineage, and ties to both the Töre aristocracy and the Alash movement made her an obvious choice to the reinstated government, and thus led to her rise to power. Now finding herself leading a reborn nation of millions, one question remains within the government: Will she match her father's legacy, or lead the nation down a path of no return, for better or worse? Only time will tell."

 # National Spirits
 KAZ_alikhan_b_national_spirit_r56: "The First Prime Minister"
 KAZ_alikhan_b_national_spirit_r56_desc: "Despite all that he has been through, Alikhan Bukeikhanov has survived long enough to see his homeland become a free nation once more. For the people of [ROOT.GetNonIdeologyName], it is an honour to see their founding father live long enough to experience this moment."

 # Bookmark
 KAZ_GATHERING_STORM_DESC: "The defeat of the Kazakh Khanate by Russia saw the end of an independent Qazaq state and the beginning of Russian rule. However, even under the thumb of the Russian Tsar and Stalin's Heart of Steel, the Qazaqs continued to fight for their long desired independence. One of these, the Alash Orda, saw the Qazaqs assuming responsibility for their own state, before submitting to the Red Army in 1920. This experiment, still ingrained into the hearts and minds of Qazaqs, has continued to be the main motivator for the Qazaq people's desire for independence, and what would drive them to achieve it."
