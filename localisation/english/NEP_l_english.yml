 NEP_family_politics_decision_category:0 "Family Politics"
 NEP_family_politics_decision_category_desc:0 "With the concentration of political power firmly in the hands of the Ranas, and their overwhelming influence in the military, any change in course towards a revisionist and militaristic form of government must come from within the family itself."
