 # Himalayan Politics
 NEP_transhimalayan_politics_r56:0 "Trans-Himalayan Politics"
 NEP_transhimalayan_politics_r56_desc:0 ""

 NEP_invite_ladakh_into_defensive_pact_r56:0 "Invite [KAS.GetNameDef] Into the Himalayan Defense Pact"
 NEP_invite_ladakh_into_defensive_pact_r56_desc:0 "Kashmir as a region has been dominated by many empires throughout its long and rich history. Only recently was it granted the opportunity to establish itself as a sovereign and free nation under the rule of [KAS.GetLeader]. To prevent [KAS.GetNonIdeologyName] from falling into foreign hands once more, we should expand our defensive pact with our fellow Himalayan states into the west by extending a friendly hand to the [KAS.GetAdjective]s."

 # Events
 # England has Entered a State of War
 nepal.1.t:0 "[ENG.GetNameDefCap] has Entered a State of War"
 nepal.1.d:0 "Some days ago, a new war has broken out in Europe, and possibly across the world! The outcome of what is to be called 'The Great War'. [ROOT.GetNameDefCap] has a reason to support [ENG.GetNameDef] and is, in a way, obligated to do so by the Nepal-Britain Treaty of 1923, whereby our two nations will recognize eachother's sovereignty and protect said sovereignty."
 nepal.1.a:0 "We must aid our allies. Immediately declare war!"
 nepal.1.b:0 "The national interests of Nepal come first..."

 # Whispers of Change
 nepal.2.t:0 "Whispers of Change"
 nepal.2.desc:0 "One of our officials reported having discovered a leaflet calling for political changes. This proves that at least one group wishing for our demise is getting organized."
 nepal.2.a:0 "We must remain vigilant."

 # Nepal Proposes Joint Military Exercise
 nepal.4.t:0 "[FROM.GetNameDefCap] Proposes Joint Military Exercise"
 nepal.4.desc:0 "Today the government of [FROM.GetNameDef] has sent us a telegram, proposing a joint military exercise between our two nations with the intention of enhancing both of our army's fighting capabilities."
 nepal.4.a:0 "Sure."
 nepal.4.b:0 "Not today."

 # FROM Rejects 
 nepal.5.t:0 "[FROM.GetNameDefCap] Rejects Joint Military Exercise"
 nepal.5.desc:0 "Our proposal for joint military exercises with [FROM.GetNameDef] was rejected by their government."
 nepal.5.a:0 "Unfortunate."

 # FROM Accepts
 nepal.6.t:0 "[FROM.GetNameDefCap] Accepts Joint Military Exercise"
 nepal.6.desc:0 "Our proposal for joint military exercises with [FROM.GetNameDef] was accepted by their government."
 nepal.6.a:0 "Good."

