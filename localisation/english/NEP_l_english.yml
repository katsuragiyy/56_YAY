 ######## DECISIONS ########

 NEP_nepali_army_r56:0 "The Nepali Army"
 NEP_nepali_army_r56_desc:0 "The members of the Rana clan enter the army at a very young age, owing their rank not to their abilities but to their position in the family tree. Therefore, despite their education being paid for by their vast wealth, a certain number of them have become complacent, relying on obsolete military strategies."
 NEP_train_mohan_rana:0 "Train Mohan Rana"
