 NEP_upper_mustang_refugees_r56:0 "Refugees from Upper Mustang"
 NEP_upper_mustang_refugees_r56_desc:0 "Following the [NEP.GetAdjective] forceful annexation of Upper Mustang, many in the area have decided to seek refuge in our nation in fear of persecution of the [NEP.GetAdjective] regime."

 # Himalayan Politics
 NEP_transhimalayan_politics_r56:0 "Trans-Himalayan Politics"
 NEP_transhimalayan_politics_r56_desc:0 ""

 NEP_invite_tibet_into_defensive_pact_r56:0 "Invite [TIB.GetNameDef] Into the Himalayan Defense Pact"
 NEP_invite_tibet_into_defensive_pact_r56_desc:0 "[ROOT.GetNonIdeologyName] and [TIB.GetNonIdeologyName] have a long and complicated relationship with one another. From the Sino-Gorkha, which led to the loss of [NEP.GetAdjective] suzerainty over Tibet, to the early 20th century where we were key mediators between Tibet and foreign powers such as the Great Qing and British empires. Our two nations have always been intertwined with one another, and it seems like this intertwining will continue for many more years to come. However, with rising tensions in neighboring states, it might be a perfect opportunity to call upon our [TIB.GetAdjective] brothers for increased cooperation between our two nations, starting from proposing a defensive pact between us which will ensure the security and sovereignty of both of our nations."

 NEP_invite_bhutan_into_defensive_pact_r56:0 "Invite [BHU.GetNameDef] Into the Himalayan Defense Pact"
 NEP_invite_bhutan_into_defensive_pact_r56_desc:0 "Ever since the Sino-Gorkha war in 1792, diplomatic relations between our nation and [BHU.GetNameDef] have been strained due to their suspected support of our enemies. Although, as a modernizing and developing nation, we must also rethink this mindset. With tensions in our surrounding regions rising, holding a grudge on a neighbor will only give us another front to worry about. It may be a perfect opportunity for our two nations to reconcile by entering into a defensive pact with one another and to secure another ally in these troubling times."

 NEP_invite_sikkim_into_defensive_pact_r56:0 "Invite [SKK.GetNameDef] Into the Himalayan Defense Pact"
 NEP_invite_sikkim_into_defensive_pact_r56_desc:0 "Whilst our nations share a complicated history with one another, and some [ROOT.GetAdjective] nationalists claiming Sikkim to be part of a Greater Nepalese realm, we must put it all aside and show goodwill to our [SKK.GetAdjective] neighbor by inviting them to our defense pact in order to protect them from potential external threats."

 NEP_invite_ladakh_into_defensive_pact_r56:0 "Invite [KAS.GetNameDef] Into the Himalayan Defense Pact"
 NEP_invite_ladakh_into_defensive_pact_r56_desc:0 "Kashmir as a region has been dominated by many empires throughout its long and rich history. Only recently was it granted the opportunity to establish itself as a sovereign and free nation under the rule of [KAS.GetLeader]. To prevent [KAS.GetNonIdeologyName] from falling into foreign hands once more, we should expand our defensive pact with our fellow Himalayan states into the west by extending a friendly hand to the [KAS.GetAdjective]s."

 NEP_invade_upper_mustang_r56:0 "Put an End to Upper Mustang's Autonomy"
 NEP_invade_upper_mustang_r56_desc:0 "The Kingdom of Lo, otherwise known as Upper Mustang, is an isolated autonomous entity within our borders that holds much strategic importance due to its location between us and [TIB.GetNameDef]. While they have no standing armed force and don't serve as a threat from a military point of view, their political and cultural ties to [TIB.GetNameDef] make them unreliable and untrustworthy. Without an armed force, we can easily secure the kingdom militarily without much resistance. But if [TIB.GetNameDef] decides to respond to this action, then we risk escalating the matter."

 # Political Actions
 NEP_border_war_with_tibet_r56:0 "Skirmish on the [NEP.GetAdjective]-[TIB.GetAdjective] Border"


 # Events
 # England has Entered a State of War
 nepal.1.t:0 "[ENG.GetNameDefCap] has Entered a State of War"
 nepal.1.d:0 "Some days ago, a new war has broken out in Europe, and possibly across the world! The outcome of what is to be called 'The Great War'. [ROOT.GetNameDefCap] has a reason to support [ENG.GetNameDef] and is, in a way, obligated to do so by the Nepal-Britain Treaty of 1923, whereby our two nations will recognize eachother's sovereignty and protect said sovereignty."
 nepal.1.a:0 "We must aid our allies. Immediately declare war!"
 nepal.1.b:0 "The national interests of Nepal come first..."

 # Whispers of Change
 nepal.2.t:0 "Whispers of Change"
 nepal.2.desc:0 "One of our officials reported having discovered a leaflet calling for political changes. This proves that at least one group wishing for our demise is getting organized."
 nepal.2.a:0 "We must remain vigilant."

 # Nepal Proposes Joint Military Exercise
 nepal.4.t:0 "[FROM.GetNameDefCap] Proposes Joint Military Exercise"
 nepal.4.desc:0 "Today the government of [FROM.GetNameDef] has sent us a telegram, proposing a joint military exercise between our two nations with the intention of enhancing both of our army's fighting capabilities."
 nepal.4.a:0 "Sure."
 nepal.4.b:0 "Not today."

 # FROM Rejects 
 nepal.5.t:0 "[FROM.GetNameDefCap] Rejects Joint Military Exercise"
 nepal.5.desc:0 "Our proposal for joint military exercises with [FROM.GetNameDef] was rejected by their government."
 nepal.5.a:0 "Unfortunate."

 # FROM Accepts
 nepal.6.t:0 "[FROM.GetNameDefCap] Accepts Joint Military Exercise"
 nepal.6.desc:0 "Our proposal for joint military exercises with [FROM.GetNameDef] was accepted by their government."
 nepal.6.a:0 "Good."

 # Our Role in Himalayan Politics
 nepal.7.t:0 "Our Role in Himalayan Politics"
 nepal.7.desc:0 ""
 nepal.7.a:0 "We must strive for a peaceful Himalayan future."
 nepal.7.b:0 "[ROOT.GetNonIdeologyName] is superior to all!"

 # [FROM.GetNameDefCap] Suggests Defensive Pact
 nepal.8.t:0 "[FROM.GetNameDefCap] Suggests Defensive Pact"
 nepal.8.desc:0 ""
 nepal.8.a:0 "They raise a good point."
 nepal.8.b:0 "They are not to be trusted."

 # FROM Rejects Defensive Pact
 nepal.9.t:0 "[FROM.GetNameDefCap] Rejects Our Proposal"
 nepal.9.desc:0 ""
 nepal.9.a:0 "Their loss."

 # FROM Accepts Defensive Pact
 nepal.10.t:0 "[FROM.GetNameDefCap] Accepts Our Proposal"
 nepal.10.desc:0 ""
 nepal.10.a:0 "We stand stronger together."

 # Himalayan Defense Pact Member Under Attack!
 nepal.11.t:0 "Himalayan Defense Pact Member Under Attack!"
 nepal.11.desc:0 ""
 nepal.11.a:0 "Come to their aid immediately!"
 nepal.11.b:0 "On second thought.."

 # Militarization of the Himalayan Defense Pact
 nepal.12.t:0 "Militarization of the Himalayan Defense Pact"
 nepal.12.desc:0 ""
 nepal.12.a:0 "And so on."

 # FROM Proposes Militarizing the HDP
 nepal.13.t:0 "[FROM.GetNameDefCap] Proposes Militarizing the HDP"
 nepal.13.desc:0 ""
 nepal.13.a:0 "They raise a valid point."
 nepal.13.b:0 "Lets preserve the status quo."

 # FROM Suggests Federalizing the Himalayan Defense Pact
 nepal.14.t:0 "[FROM.GetNameDefCap] Suggests Federalizing the Himalayan Defense Pact"
 nepal.14.desc:0 ""
 nepal.14.a:0 "A sound idea."
 nepal.14.b:0 "Delusional."

 # The Goal of Our Expansion
 nepal.15.t:0 "The Goal of Our Expansion?"
 nepal.15.desc:0 ""
 nepal.15.a:0 "To conquer our Himalayan neighbors!"
 nepal.15.b:0 "To subjugate our Himalayan neighbors!"

 # Nepal Invades Upper Mustang
 mustang_crisis.1.t:0 "[FROM.GetNameDefCap] Violates Upper Mustang's Autonomy"
 mustang_crisis.1.desc:0 "Some days ago, [FROM.GetAdjective] soldiers crossed into the Kingdom of Lo's boundaries, seeking to relinquish it of its autonomy as a kingdom within [FROM.GetNameDef]. The Kingdom of Lo are culturally and politically tied to our nation and people, and not protecting them would mean abandoning our fellow brothers and sisters in the face of tyranny."
 mustang_crisis.1.a:0 "This is not worth an escalation."
 mustang_crisis.1.b:0 "Prepare the army at once!"

 # Tibet Doesn't Pursue Military Intervention
 mustang_crisis.2.t:0 "[FROM.GetNameDefCap] Doesn't Pursue Military Intervention"
 mustang_crisis.2.desc:0 "It seems as if our show of force in Upper Mustang was enough to scare off the [FROM.GetAdjective]s from pursuing military action against us. If they are willing to let Mustang fall, then how far can we go with this until they feel the need to intervene?"
 mustang_crisis.2.a:0 "Only time will tell."

 # Tibet Stations Soldiers on Our Border
 mustang_crisis.3.t:0 "[FROM.GetNameDefCap] Stations Soldiers on Our Border"
 mustang_crisis.3.desc:0 "In a show of force following our recent actions in Upper Mustang, [FROM.GetNameDef] has begun moving its soldiers to our border. This can only mean one thing, being that [FROM.GetNameDef] is preparing to strike our nation!"
 mustang_crisis.3.a:0 "This can't be good."

 # ROOT Soldiers March in Victory
 mustang_crisis.4.t:0 "[GetROOTWinsBorderSkirmish]"
 mustang_crisis.4.desc:0 "[GetROOTWinsBorderSkirmishDesc]"
 mustang_crisis.4.a:0 "A great victory for [ROOT.GetNonIdeologyName]!"

 # Our Troops Forced to Retreat
 mustang_crisis.5.t:0 "[GetROOTLosesBorderSkirmish]"
 mustang_crisis.5.desc:0 "[GetROOTLosesBorderSkirmishDesc]"
 mustang_crisis.5.a:0 "We'll get them next time."

 # Stalemate in Upper Mustang
 mustang_crisis.6.t:0 "Stalemate in Upper Mustang"
 mustang_crisis.6.desc:0 "After intense fighting in the harsh terrain of Upper Mustang, the troops on the front have exhausted all of their energy and a ceasefire between the commanding officers has been signed. Whether this is a victory or a loss is up to interpretation, but many within our nation consider this an embarrassing show of incompetence by our army."
 

 # Focuses
 NEP_maintain_british_ties_r56:0 "Maintain [ENG.GetAdjective] Ties"
 NEP_maintain_british_ties_r56_desc:0 "Our friendship with [ENG.GetNameDef] has proven to be nothing but mutually benefical for both of our great nations, as we provide them a buffer between India and China, and they provide us with much needed political support. Let us continue this prosperous relationship."
 NEP_we_join_britains_war_tt:0 "If §Y[ENG.GetNameDef]§! enters into a state of §RWar§!, we will receive an §OEvent§! which will allow us to §GJoin§! the war on their side." # Tooltip

 NEP_strengthen_chinese_ties_r56:0 "Strengthen [CHI.GetAdjective] Relations"
 NEP_strengthen_chinese_ties_r56_desc:0 "[ROOT.GetNonIdeologyName] and [CHI.GetNonIdeologyName] share a long history with one another, with [CHI.GetNonIdeologyName] still playing an important role in Trans-himalayan politics. Under the premiership of Bhim Shumsher, [ROOT.GetNameDef] warmed up to the [CHI.GetAdjective] Kuomintang and established friendly ties with the nation. Maybe [ROOT.GetLeader] can follow in his steps and strengthen our preexisting ties with the [CHI.GetAdjective] government?"
 NEP_if_completed_focus_expeditionary_force:0 "If §OThe Nepali Expeditionary Force§! is completed:" # Tooltip

 NEP_normalize_relations_with_the_united_states_r56:0 "Normalize Relations with the United States"
 NEP_normalize_relations_with_the_united_states_r56_desc:0 "Laying the foundations for a friendly relationship with [USA.GetNameDef] is essential for [ROOT.GetNonIdeologyName] future, especially if we seek to distance ourselves from [ENG.GetNameDef] in the future and establish a fully independent foreign policy. Aside from securing more diplomatic freedom, establishing a friendly relationship with the United States may help us in the economic sector by inviting [USA.GetAdjective] engineers and industrialists to aid in [ROOT.GetNonIdeologyName]'s industrial sector."

 NEP_renegotiate_unfair_treaties_r56:0 "Renegotiate Unfair Treaties"
 NEP_renegotiate_unfair_treaties_r56_desc:0 "Following our defeat to the [ENG.GetAdjective], [NEP.GetNameDef] was forced to cede much of its territory to the [ENG.GetAdjective] in a humiliating treaty known as the 'Treaty of Sugauli in 1816'. This undid the decades old process of uniting Nepal as a region under one banner. But now that we have much friendlier ties with [ENG.GetNameDef], and with our contributation to the British Empire, maybe they will be generous and return us our rightful land in exchange of a strong ally in the region?"

