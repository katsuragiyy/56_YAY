 nepal.7.t:0 "Our Role in Himalayan Politics"
 nepal.7.desc:0 ""
 nepal.7.a:0 "We must strive for a peaceful Himalayan future."
 nepal.7.b:0 "[ROOT.GetNonIdeologyName] is superior to all!"

