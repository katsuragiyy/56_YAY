 ######## CHARACTERS ########

 NEP_juddha_rana_leader_desc:0 "Juddha Rana was born as Juddha Shumsher Jung Bahadur Rana in 1875 to the then Commander-In-Chief of the Nepalese Army, Dhir Shumsher Rana who belonged to the ruling Rana Dynasty, and his wife Juhar Kumari Devi. When Juddha Rana was merely nine years of age his father passed away, which would go on to have a major impact on him and his sibilings. Not long after his father's passing in 1885, a revolution swept through Nepal which granted an opportunity for his older brother, Bir Shum Shere to ascend to the premiership of Nepal. Immediately after securing power, Bir Shum Shere promoted Juddha Rana to a general. In the years that followed, Juddha Rana would hold many positions within the army, eventually being granted full command over the armed forces. \n\nAfter the passing of Prime Minister Bhim Shum Shere in 1932, Juddha Rana, with the trust he had earned from his sibilings and cousins during his military career, ascended to the premiership of Nepal. Following his ascension, he promoted his brothers and cousins to multiple positions within the government, supress the King's power even further than he had been under previous Rana rulers, and with the support of the army he had commanded for decades, was able to supress any revolutionaries that sought to oppose the Rana dynasty's continued autocratic rule. Alongside this, family politics within the Rana dynasty have also led to many of Juddha Rana's close allies being exiled and having to seek refuge in India. The political situation in Nepal seems to be deteriorating day by day, and only time will tell if Juddha Rana's efforts of securing power prove successful or result in another revolution."

