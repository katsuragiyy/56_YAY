 # Scripted Localisation
 NEP_tibet_wins_scripted_loc:0 "[ROOT.GetAdjective] Soldiers March in Victory"
 NEP_nepal_wins_scripted_loc:0 "[ROOT.GetAdjective] Soldiers Force [TIB.GetNameDef] to Retreat"

 NEP_tibet_wins_desc_scripted_loc:0 "After the tyrannical regime of [NEP.GetNameDef] invaded the Kingdom of Lo in Upper Mustang and our immediate intervention, the brave [ROOT.GetAdjective] troops engaged the [NEP.GetAdjective] soldiers in combat. After a days long battle, they have been able to drive the [NEP.GetAdjective] into a retreat and reinstate Upper Mustang's rightful autonomy. The battle hardened [ROOT.GetAdjective] soldiers now march to [ROOT.Capital.GetCapitalVictoryPointName] in glory."
 NEP_nepal_wins_desc_scripted_loc:0 "As the [TIB.GetAdjective] soldiers hurry to evacuate from Upper Mustang, the [ROOT.GetAdjective] soldiers march in glory back home, having defeated a much larger nation in a show of superiority of the [ROOT.GetAdjective] nation. With Upper Mustang out of the way, we now have a safe passage into [TIB.GetNameDef] which we can use to threaten the [TIB.GetAdjective]s in the event they attempt to attack us once more."

 NEP_tibet_loses_scripted_loc:0 "Our Troops Forced to Retreat"
 NEP_nepal_loses_scripted_loc:0 "Humiliating Defeat in Upper Mustang"

 NEP_tibet_loses_desc_scripted_loc:0 "Despite our best efforts, our soldiers were overwhelmed in the fight against the elite [NEP.GetAdjective] units and were forced to retreat to where they came from. This defeat now leaves our allies in Upper Mustang at [NEP.GetNameDef]'s mercy."
 NEP_nepal_loses_desc_scripted_loc:0 "After a hard fought battle between [ROOT.GetNonIdeologyName]'s most elite forces and the [TIB.GetAdjective] troops, our units were humiliated in a decisive defeat and were forced to retreat outside of the territory, undoing our progress in the annexation of Upper Mustang."

 