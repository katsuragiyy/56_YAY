 # Ideas
 NEP_economic_exploitation_r56:0 "Economic Exploitation"
 NEP_economic_exploitation_r56_desc:0 "The Rana clan has been exploiting the resources of Nepal for decades to maintain its tight control over the nation. And although some modernization efforts and reforms have been introduced, the clan will not allow further development if it threatens their hold on power."
 NEP_cannot_change_eco_law:0 "Can change trade laws: §RNo§!"

