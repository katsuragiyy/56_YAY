 # Decisions

 # Greater Nepal
 NEP_greater_nepal_r56:0 "Dream of Greater Nepal"
 NEP_greater_nepal_r56_desc:0 ""

 NEP_integrate_bihar_r56:0 "Integrate [1092.GetName]"
 NEP_integrate_bihar_r56_desc:0 ""

 NEP_integrate_uttarakhand_r56:0 "Integrate [1090.GetName]"
 NEP_integrate_uttarakhand_r56_desc:0 "In the late 18th century, [1090.GetName] was conquered by the Gorkha Empire, our predecessor state. For many years it remained under the [ROOT.GetAdjective] domain until the imperialist scum unfairly seized it from us in 1816. Now that our armies have occupied the region once more, we may be able to undo the injustice imposed on us by foreigners and integrate [1090.GetName] into our domain!"

 NEP_integrate_sikkim_r56:0 "Integrate [1013.GetName]"
 NEP_integrate_sikkim_r56_desc:0 "[1013.GetName] has both a cultural and historical connection to [ROOT.GetNonIdeologyName], with most of the population speaking the Nepali language. But tragedy struck in 1816, when [1013.GetName] was forcefully separated from us by the imperialist scum, and became a kingdom of it's own run by illegitimates. With [1013.GetName] back under the fold temporarily, it serves as the perfect opportunity to reintegrate the lost territory into it's rightful domain!"

