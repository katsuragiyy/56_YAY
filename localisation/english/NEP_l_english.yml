 NEP_involvement_in_the_sinojapanese_war_r56_desc:0 "WIP \n\n§WWill be §RRemoved§! once the §Y2nd Sino-Japanese War§! concludes.§!"

 NEP_market_restriction_r56:0 "Restricted Access to the International Market"
 NEP_market_restriction_r56_desc:0 "While in theory the Nepal-Britain Treaty of 1923 allows us to purchase and import military equipment from other nations through India, in practice, the [ENG.GetAdjective] still hold the final say in our purchases and can easily invalidate or confiscate said weapons. This greatly hinders our stockpile quantity and actively reinforces [ENG.GetNameDef]'s influence over our nation."
 NEP_can_only_exchange_arms_with_uk:0 "Allows for Arms Trade with §Y[ENG.GetNameDef]§! and §Y[RAJ.GetNameDef]§!" # Tooltip
 NEP_we_can_only_trade_with_uk_tt:0 "§Y[NEP.GetNameDefCap]§! is only allowed to purchase weapons from us." # Tooltip

