 r56.news_event.1121.t:0 "Eruption at Rabaul"
 r56.news_event.1121.desc:0 "'Rabaul volcano is one of the most active and most dangerous volcanoes in New Guinea' - A famous quote by many volcanologists has now been proven true, as both the Vulcan and Tavurvur erupted simultaneously, killing 507 people and destroying the entire city of Rabaul. The skies were filled with the smoke of the volcano, blocking the sky for hours on end, as Rabaul was left in ruins. The Mandate Government has relocated to the more secure port city of Lae, which is far from any volcanically active volcano. So far there have been no reports on the next steps of the Australian Government, but it seems likely that Rabaul will almost never recover from this giant and catastrophic event."
 r56.news_event.1121.b:0 "A Disaster."
